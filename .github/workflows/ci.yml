name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated API client is up to date
        run: |
          npx orval --config orval.config.ts
          git diff --exit-code src/api/generated

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Audit dependencies
        # The `overrides` block in package.json is what currently keeps this at
        # zero; without a gate here, the next transitive bump undoes that
        # quietly.
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

      - name: Assert the bundle ships a CSP
        # The policy is added by a build-only Vite plugin, so nothing in dev or
        # in the test run would notice it going missing.
        run: grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
